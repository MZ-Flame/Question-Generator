<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TZ Learners</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="gear (4).png">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-r from-blue-100 to-purple-100 flex justify-center items-center min-h-screen p-4">
    <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-2xl transition-transform hover:scale-105">
        <img src="Wrench Book 1.jpg" style="height: 110px;width: 110px;float: left;">
        <h1 style="font-size: 30px;margin-top: 40px;float: left;" class="text-2xl font-semibold text-indigo-600 text-center mb-6">Question Generator</h1>
        <p style="font-size: 20px;margin-top: 150px;" class="text-gray-700 text-center mb-4">Generate Question</p>

        <div class="mb-4">
            <label for="topic" class="block text-gray-700 text-sm font-bold mb-2">Select a Topic:</label>
            <select id="topic" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="math">Mathematics</option>
                <option value="science">Science</option>
                <option value="biology">Biology</option>
                <option value="chemistry">Chemistry</option>
                <option value="physics">Physics</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="difficulty" class="block text-gray-700 text-sm font-bold mb-2">Select Difficulty:</label>
            <select id="difficulty" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="problem-type" class="block text-gray-700 text-sm font-bold mb-2">Select Problem Type:</label>
            <select id="problem-type" class="shadow appearance-none border rounded w-full py-3 px-4 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
                <option value="multiple_choice">One Word</option>
                <option value="short_answer">Short Answer</option>
                <option value="essay">Essay</option>
            </select>
        </div>

        <div class="mb-6">
            <button id="generate" class="bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-bold py-3 px-6 rounded-full focus:outline-none focus:shadow-outline transition duration-300 ease-in-out w-full">
                Generate Problem
            </button>
        </div>

        <div id="problem" class="border rounded-md p-4 bg-gray-50 text-gray-800 text-lg leading-relaxed">
            <p class="text-center italic text-gray-600">A problem will appear here...</p>
        </div>
    </div>

    <script src="Function.js"></script>
</body>
</html>
