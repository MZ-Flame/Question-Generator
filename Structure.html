<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyBot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Design.css">
    <script src="Function.js" defer></script>
</head>
<body class="bg-gray-100 font-inter">
    <header class="bg-blue-500 text-white py-4 shadow-md">
        <div class="container mx-auto px-4">
            <h1 class="text-3xl font-semibold">StudyBot</h1>
        </div>
    </header>

    <main class="container mx-auto py-6 px-4">
        <div class="bg-white rounded-lg shadow-lg p-6 mb-8">
            <div id="chat-container">
                <div id="chat-log" class="mb-4 p-4 rounded-md bg-gray-50 border border-gray-200 overflow-y-auto h-64">
                    <div class="text-gray-700">Welcome to StudyBot! How can I help you today?</div>
                </div>
                <div class="flex space-x-2">
                    <input type="text" id="user-input" placeholder="Type your message..." class="flex-1 p-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
                    <button id="send-button" class="bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">
                        Send
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-gray-200 text-gray-600 py-4 text-center">
        <p>&copy; 2024 <span id="copyright">TZ Friends</span>. All rights reserved.</p>
    </footer>

    <script>
        // Get references to HTML elements
        const chatLog = document.getElementById('chat-log');
        const userInput = document.getElementById('user-input');
        const sendButton = document.getElementById('send-button');

        // Function to add a message to the chat log
        function addMessage(sender, message) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('mb-2'); // Add margin for spacing

            const senderSpan = document.createElement('span');
            senderSpan.classList.add('font-semibold', sender === 'You' ? 'text-blue-500' : 'text-green-500'); // Style sender name
            senderSpan.textContent = sender + ': ';

            const messageSpan = document.createElement('span');
            messageSpan.textContent = message;
            messageDiv.appendChild(senderSpan);
            messageDiv.appendChild(messageSpan);
            chatLog.appendChild(messageDiv);

            // Scroll to the bottom of the chat log to show the latest message
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        // Function to handle user input and generate a response
        function handleInput() {
            const userMessage = userInput.value.trim();

            if (userMessage === '') return; // Don't send empty messages

            addMessage('You', userMessage);
            userInput.value = ''; // Clear the input field

            // Simulate a response from the bot (replace with your actual logic)
            let botResponse = getBotResponse(userMessage);
            addMessage('StudyBot', botResponse);
        }

        // Function to generate a bot response (replace with your logic)
        function getBotResponse(userMessage) {
            userMessage = userMessage.toLowerCase(); // Convert to lowercase for easier matching

            if (userMessage.includes('hello') || userMessage.includes('hi') || userMessage.includes('hey')) {
                return "Hello there!";
            } else if (userMessage.includes('how are you')) {
                return "I'm doing well, thank you!";
            } else if (userMessage.includes('help')) {
                return "I can help you with study resources and answer questions.  Try asking me about a specific topic!";
            } else {
                return "I'm sorry, I don't understand that yet.  Could you please rephrase your question?";
            }
        }

        // Event Listeners
        sendButton.addEventListener('click', handleInput);
        userInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                handleInput();
            }
        });
    </script>
</body>
</html>
